apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: healthmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: healthmate/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:5001
            - name: PATIENT_SERVICE_URL
              value: http://patient-service:5002
            - name: DOCTOR_SERVICE_URL
              value: http://doctor-service:5003
            - name: APPOINTMENT_SERVICE_URL
              value: http://appointment-service:5004
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:5005
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:5006
            - name: TELEMEDICINE_SERVICE_URL
              value: http://telemedicine-service:5007
            - name: PRESCRIPTION_SERVICE_URL
              value: http://prescription-service:5008
            - name: ADMIN_SERVICE_URL
              value: http://admin-service:5009
            - name: AI_SERVICE_URL
              value: http://ai-service:5010
          envFrom:
            - configMapRef:
                name: gateway-config
                optional: true
            - secretRef:
                name: gateway-secret
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: healthmate
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
