apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doctor-stack-ingress
  namespace: healthmate
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: healthmate.local
      http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 5001
          - path: /api/doctors(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: doctor-service
                port:
                  number: 5003
          - path: /api/appointments(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: appointment-service
                port:
                  number: 5004
          - path: /api/prescriptions(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: prescription-service
                port:
                  number: 5008
          - path: /api/telemedicine(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: telemedicine-service
                port:
                  number: 5007
