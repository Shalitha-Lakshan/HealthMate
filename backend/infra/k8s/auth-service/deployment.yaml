apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: healthmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: healthmate/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: auth-service-config
                optional: true
            - secretRef:
                name: auth-service-secret
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: healthmate
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP
