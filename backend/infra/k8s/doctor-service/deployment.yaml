apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: healthmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: healthmate/doctor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: doctor-service-config
                optional: true
            - secretRef:
                name: doctor-service-secret
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: healthmate
spec:
  selector:
    app: doctor-service
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
  type: ClusterIP
