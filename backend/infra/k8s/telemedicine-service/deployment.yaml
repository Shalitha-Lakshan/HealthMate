apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: healthmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
        - name: telemedicine-service
          image: healthmate/telemedicine-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5007
          envFrom:
            - configMapRef:
                name: telemedicine-service-config
                optional: true
            - secretRef:
                name: telemedicine-service-secret
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-service
  namespace: healthmate
spec:
  selector:
    app: telemedicine-service
  ports:
    - protocol: TCP
      port: 5007
      targetPort: 5007
  type: ClusterIP
