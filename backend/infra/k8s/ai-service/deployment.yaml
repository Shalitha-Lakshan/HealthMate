apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healthmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: healthmate/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5010
          envFrom:
            - configMapRef:
                name: ai-service-config
                optional: true
            - secretRef:
                name: ai-service-secret
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: healthmate
spec:
  selector:
    app: ai-service
  ports:
    - protocol: TCP
      port: 5010
      targetPort: 5010
  type: ClusterIP
