apiVersion: v1
kind: Secret
metadata:
  name: telemedicine-service-secret
  namespace: healthmate
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017/healthmate-telemedicine"
  JWT_SECRET: "replace-with-strong-jwt-secret"
  AGORA_APP_ID: "replace-with-agora-app-id"
  AGORA_APP_CERTIFICATE: "replace-with-agora-app-certificate"
  APPOINTMENT_SERVICE_URL: "http://appointment-service:5004/api/appointments"
  APPOINTMENT_INTERNAL_TOKEN: "replace-with-internal-token"
