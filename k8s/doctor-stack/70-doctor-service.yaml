apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: healthmate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: healthmate/doctor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: doctor-service-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: doctor-service-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: healthmate
spec:
  selector:
    app: doctor-service
  ports:
    - name: http
      port: 5003
      targetPort: 5003
  type: ClusterIP
