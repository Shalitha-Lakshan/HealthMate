services:
  - type: web
    name: gateway
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/gateway
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5000"
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          type: web
          property: hostport
      - key: PATIENT_SERVICE_URL
        fromService:
          name: patient-service
          type: web
          property: hostport
      - key: DOCTOR_SERVICE_URL
        fromService:
          name: doctor-service
          type: web
          property: hostport
      - key: APPOINTMENT_SERVICE_URL
        fromService:
          name: appointment-service
          type: web
          property: hostport
      - key: PAYMENT_SERVICE_URL
        fromService:
          name: payment-service
          type: web
          property: hostport
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: notification-service
          type: web
          property: hostport
      - key: TELEMEDICINE_SERVICE_URL
        fromService:
          name: telemedicine-service
          type: web
          property: hostport
      - key: PRESCRIPTION_SERVICE_URL
        fromService:
          name: prescription-service
          type: web
          property: hostport
      - key: ADMIN_SERVICE_URL
        fromService:
          name: admin-service
          type: web
          property: hostport
      - key: AI_SERVICE_URL
        fromService:
          name: ai-service
          type: web
          property: hostport

  - type: web
    name: auth-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/auth-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5001"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: INTERNAL_SERVICE_TOKEN
        sync: false

  - type: web
    name: patient-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/patient-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5002"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: doctor-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/doctor-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5003"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: appointment-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/appointment-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5004"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APPOINTMENT_INTERNAL_TOKEN
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth-service
          type: web
          property: hostport
      - key: AUTH_INTERNAL_TOKEN
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: notification-service
          type: web
          property: hostport
      - key: NOTIFICATION_INTERNAL_TOKEN
        sync: false
      - key: APPOINTMENT_TIMEZONE_OFFSET
        value: "+05:30"
      - key: APPOINTMENT_PAYMENT_HOLD_MINUTES
        value: "10"
      - key: DEFAULT_CONSULTATION_FEE
        value: "3500"

  - type: web
    name: payment-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/payment-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5005"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APPOINTMENT_SERVICE_URL
        fromService:
          name: appointment-service
          type: web
          property: hostport
      - key: APPOINTMENT_INTERNAL_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYMENT_SUCCESS_URL
        sync: false
      - key: PAYMENT_CANCEL_URL
        sync: false

  - type: web
    name: notification-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/notification-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5006"
      - key: MONGO_URI
        sync: false
      - key: NOTIFICATION_INTERNAL_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_SESSION_NAME
        value: healthmate-notifier
      - key: WHATSAPP_AUTH_PATH
        value: /app/.wwebjs_auth
      - key: CHROMIUM_PATH
        sync: false

  - type: web
    name: telemedicine-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/telemedicine-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5007"
      - key: MONGO_URI
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_TOKEN_EXPIRE_SECONDS
        value: "3600"

  - type: web
    name: prescription-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/prescription-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5008"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APPOINTMENT_SERVICE_URL
        fromService:
          name: appointment-service
          type: web
          property: hostport
      - key: APPOINTMENT_INTERNAL_TOKEN
        sync: false

  - type: web
    name: admin-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/admin-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5009"
      - key: MONGO_URI
        sync: false
      - key: AUTH_MONGO_URI
        sync: false
      - key: PAYMENT_MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: notification-service
          type: web
          property: hostport
      - key: NOTIFICATION_INTERNAL_TOKEN
        sync: false

  - type: web
    name: ai-service
    env: docker
    plan: free
    autoDeploy: true
    rootDir: backend/services/ai-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5010"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
